<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="200" viewBox="0 0 1000 200" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif">
  <defs>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.75">
      <stop offset="0" stop-color="#4F3130"/>
      <stop offset="1" stop-color="#33201f"/>
    </radialGradient>
    <linearGradient id="hairline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F5B841" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#F5B841"/>
      <stop offset="1" stop-color="#F5B841" stop-opacity="0"/>
      <animate attributeName="x1" values="0.3;0.7;0.3" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0.7;0.3;0.7" dur="7s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="200" fill="url(#glow)"/>

  <g stroke="#F5B841" stroke-opacity="0.07" stroke-width="1">
    <line x1="0" y1="40" x2="1000" y2="40"/>
    <line x1="0" y1="160" x2="1000" y2="160"/>
    <line x1="250" y1="0" x2="250" y2="200"/>
    <line x1="500" y1="0" x2="500" y2="200"/>
    <line x1="750" y1="0" x2="750" y2="200"/>
  </g>

  <text x="500" y="82" text-anchor="middle" font-size="46" font-weight="700" letter-spacing="-1" fill="#efe6dc">Ryan Gabriel Siringoringo</text>

  <rect x="385" y="98" width="230" height="2.5" rx="1.25" fill="url(#hairline)"/>

  <text x="500" y="136" text-anchor="middle" font-size="17" letter-spacing="4" fill="#F5B841">FULL-STACK ENGINEER / SAAS ARCHITECT</text>
  <text x="500" y="158" text-anchor="middle" font-size="17" letter-spacing="4" fill="#F5B841">MACHINE LEARNING ENTHUSIAST</text>

  <g>
    <circle cx="160" cy="180" r="1.8" fill="#F5B841" opacity="0">
      <animate attributeName="cy" values="200;0" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.7;0" dur="10s" repeatCount="indefinite"/>
    </circle>
    <circle cx="560" cy="180" r="2.2" fill="#F5B841" opacity="0">
      <animate attributeName="cy" values="200;0" dur="13s" begin="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.6;0" dur="13s" begin="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="840" cy="180" r="1.6" fill="#F5B841" opacity="0">
      <animate attributeName="cy" values="200;0" dur="11s" begin="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.5;0" dur="11s" begin="6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>