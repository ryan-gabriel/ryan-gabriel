<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="200" viewBox="0 0 1000 200" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bgGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F3130"/>
      <stop offset="1" stop-color="#3a2423"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F72C25"/>
      <stop offset="0.5" stop-color="#F5B841"/>
      <stop offset="1" stop-color="#ADFCF9"/>
      <animate attributeName="x1" values="0;1;0" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;0;1" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="200" fill="url(#bgGlow)"/>

  <g fill="#4F3130">
    <circle cx="70" cy="36" r="3" opacity="0.9"/>
    <circle cx="106" cy="52" r="2" opacity="0.6"/>
    <circle cx="880" cy="44" r="4" opacity="0.5"/>
    <circle cx="920" cy="160" r="3" opacity="0.7"/>
    <circle cx="150" cy="168" r="2.5" opacity="0.5"/>
    <circle cx="830" cy="150" r="2" opacity="0.4"/>
    <circle cx="240" cy="30" r="2" opacity="0.4"/>
    <circle cx="760" cy="28" r="2.5" opacity="0.5"/>
  </g>

  <g>
    <circle cx="50" cy="28" r="6" fill="#F72C25"/>
    <circle cx="70" cy="28" r="6" fill="#F5B841"/>
    <circle cx="90" cy="28" r="6" fill="#ADFCF9"/>
  </g>

  <text x="500" y="88" text-anchor="middle" font-size="44" font-weight="700" letter-spacing="1" fill="#e6edf3">Ryan Gabriel Siringoringo</text>

  <rect x="370" y="106" width="260" height="4" rx="2" fill="url(#flow)"/>

  <text x="500" y="144" text-anchor="middle" font-size="21" letter-spacing="3" fill="#ADFCF9">FULL-STACK ENGINEER · SAAS ARCHITECT · ML ENTHUSIAST</text>

  <g>
    <circle cx="180" cy="180" r="2" fill="#ADFCF9" opacity="0">
      <animate attributeName="cy" values="200;0" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.8;0" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="420" cy="180" r="2.5" fill="#F5B841" opacity="0">
      <animate attributeName="cy" values="200;0" dur="12s" begin="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.7;0" dur="12s" begin="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="640" cy="180" r="2" fill="#F72C25" opacity="0">
      <animate attributeName="cy" values="200;0" dur="10s" begin="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.7;0" dur="10s" begin="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="820" cy="180" r="2.5" fill="#ADFCF9" opacity="0">
      <animate attributeName="cy" values="200;0" dur="11s" begin="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.8;0" dur="11s" begin="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="300" cy="180" r="1.8" fill="#F5B841" opacity="0">
      <animate attributeName="cy" values="200;0" dur="13s" begin="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.6;0" dur="13s" begin="8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="720" cy="180" r="1.8" fill="#F72C25" opacity="0">
      <animate attributeName="cy" values="200;0" dur="10.5s" begin="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.6;0" dur="10.5s" begin="3s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>